services:
  - type: web
    name: kaya-a2a-test-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Random token, readable in Dashboard -> Environment. Guards /secure only.
      - key: A2A_TOKEN
        generateValue: true
      # PUBLIC_BASE_URL is NOT needed: app.py falls back to RENDER_EXTERNAL_URL,
      # which Render injects automatically. Set it only to override.
